<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi API Proxy Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #4ade80; }
        .nav { display: flex; gap: 10px; }
        .nav button { background: #16213e; color: #eee; border: 1px solid #0f3460; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .nav button:hover { background: #0f3460; }
        .nav button.active { background: #4ade80; color: #1a1a2e; }
        .card { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: #4ade80; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .status-item { background: #0f3460; padding: 15px; border-radius: 8px; }
        .status-item h3 { font-size: 14px; margin-bottom: 8px; color: #eee; }
        .status-item .status { font-size: 12px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .status-item .status.online { background: #22c55e; color: #1a1a2e; }
        .status-item .status.offline { background: #ef4444; color: #1a1a2e; }
        .status-item .status.unknown { background: #f59e0b; color: #1a1a2e; }
        .log-container { background: #0f3460; padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .log-entry { padding: 5px 0; border-bottom: 1px solid #16213e; }
        .log-entry.error { color: #ef4444; }
        .log-entry.warn { color: #f59e0b; }
        .log-entry.info { color: #4ade80; }
        .config-editor { background: #0f3460; padding: 15px; border-radius: 8px; }
        .config-editor textarea { width: 100%; height: 300px; background: #1a1a2e; color: #4ade80; border: 1px solid #0f3460; padding: 10px; border-radius: 5px; font-family: monospace; resize: vertical; }
        .config-editor button { background: #4ade80; color: #1a1a2e; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .config-editor button:hover { background: #22c55e; }
        .hidden { display: none; }
        .loading { text-align: center; padding: 40px; color: #4ade80; }
        .error { color: #ef4444; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Yi API Proxy Dashboard</h1>
            <div class="nav">
                <button onclick="showPage('dashboard')" class="active" id="btn-dashboard">Dashboard</button>
                <button onclick="showPage('config')" id="btn-config">Config</button>
                <button onclick="showPage('logs')" id="btn-logs">Logs</button>
            </div>
        </div>

        <div id="page-dashboard">
            <div class="card">
                <h2>Provider Status</h2>
                <div class="status-grid" id="provider-status">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            <div class="card">
                <h2>Server Info</h2>
                <div id="server-info">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div id="page-config" class="hidden">
            <div class="card">
                <h2>Configuration</h2>
                <div class="config-editor">
                    <textarea id="config-editor"></textarea>
                    <button onclick="saveConfig()">Save Configuration</button>
                </div>
            </div>
        </div>

        <div id="page-logs" class="hidden">
            <div class="card">
                <h2>Recent Logs</h2>
                <div class="log-container" id="log-container">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        function showPage(page) {
            document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + page).classList.remove('hidden');
            document.getElementById('btn-' + page).classList.add('active');

            if (page === 'dashboard') loadDashboard();
            if (page === 'config') loadConfig();
            if (page === 'logs') loadLogs();
        }

        async function loadDashboard() {
            try {
                const [providersRes, infoRes] = await Promise.all([
                    fetch(API_BASE + '/v1/providers'),
                    fetch(API_BASE + '/')
                ]);
                const providers = await providersRes.json();
                const info = await infoRes.json();

                const statusHtml = Object.entries(providers).map(([name, p]) => `
                    <div class="status-item">
                        <h3>${p.name || name}</h3>
                        <span class="status ${p.hasApiKey ? 'online' : 'offline'}">${p.hasApiKey ? 'Configured' : 'Not Configured'}</span>
                        <div style="margin-top: 8px; font-size: 12px; color: #888;">
                            Models: ${(p.models || []).slice(0, 3).join(', ')}${(p.models || []).length > 3 ? '...' : ''}
                        </div>
                    </div>
                `).join('');
                document.getElementById('provider-status').innerHTML = statusHtml;

                document.getElementById('server-info').innerHTML = `
                    <p><strong>Version:</strong> ${info.version}</p>
                    <p><strong>Endpoints:</strong></p>
                    <ul style="margin-left: 20px; margin-top: 10px;">
                        <li>POST ${info.endpoints.chat}</li>
                        <li>GET ${info.endpoints.models}</li>
                        <li>GET ${info.endpoints.providers}</li>
                        <li>GET ${info.endpoints.health}</li>
                    </ul>
                `;
            } catch (err) {
                document.getElementById('provider-status').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        async function loadConfig() {
            try {
                const res = await fetch(API_BASE + '/config');
                const config = await res.json();
                document.getElementById('config-editor').value = JSON.stringify(config, null, 2);
            } catch (err) {
                document.getElementById('config-editor').value = 'Error loading config: ' + err.message;
            }
        }

        async function saveConfig() {
            try {
                const config = JSON.parse(document.getElementById('config-editor').value);
                const res = await fetch(API_BASE + '/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    alert('Configuration saved successfully!');
                } else {
                    alert('Error saving configuration');
                }
            } catch (err) {
                alert('Invalid JSON: ' + err.message);
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(API_BASE + '/logs');
                const logs = await res.json();
                const logsHtml = logs.map(log => `
                    <div class="log-entry ${log.level}">
                        [${log.time}] ${log.level}: ${log.message}
                    </div>
                `).join('');
                document.getElementById('log-container').innerHTML = logsHtml || '<div style="padding: 20px; color: #888;">No logs available</div>';
            } catch (err) {
                document.getElementById('log-container').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            }
        }

        loadDashboard();
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
